name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'test/**'
      - 'example/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm >= 11.5.1 exchanges the workflow's OIDC token with npm directly —
      # no NPM_TOKEN secret; npmjs.com trusts this repo + workflow instead.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Bump patch version unless the merge already set a new one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version > /dev/null 2>&1; then
            npm version patch -m "chore(release): %s"
          else
            git tag "v$VERSION"
          fi
      # prepublishOnly runs typecheck, tests, and the build before anything ships
      - run: npm publish
      - run: git push origin main --follow-tags
